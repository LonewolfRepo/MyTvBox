# Project-wide Gradle settings.

# JVM memory for Gradle daemon (helps KSP/Hilt/Compose compilation on TV-sized projects)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Performance
org.gradle.parallel=true
org.gradle.caching=true

# REQUIRED: enables AndroidX artifact resolution.
# Without this, any androidx.* dependency fails the build.
android.useAndroidX=true

# No legacy support-library dependencies in this project, so Jetifier is not needed.
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Smaller, module-scoped R classes (faster compilation)
android.nonTransitiveRClass=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
